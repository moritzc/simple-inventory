<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inventory{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a href="/" class="brand" aria-label="Zur Inventarübersicht">
        <img src="{{ url_for('static', path='logo.svg') }}" alt="Inventar Logo" width="56" height="56">
        <span>
          Simple Inventory
          <small>Alle Bestände auf einen Blick</small>
        </span>
      </a>
      <nav>
        <a href="/">Übersicht</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>
      Simple Inventory • gepflegte Bestände schaffen Klarheit
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
